name: ci

on:
  push:
    branches: [main]
  pull_request:
    # edited: a squash merge uses the pull request title as the commit header.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported version and the one the evals were run with.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.6"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Lint the skill and eval data
        run: uv run --locked evals/run.py lint
      - name: Check the graders and release gates
        run: uv run --locked evals/run.py selftest
      - name: Type-check the runner
        run: >-
          uvx mypy==2.3.1 --strict --python-version ${{ matrix.python }}
          --python-executable "$(uv python find --script evals/run.py)" evals/run.py evals/runner

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages against the release policy
        env:
          # Passed through the environment, not interpolated: a pull request title is untrusted input.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA" "$TITLE"

  release-evidence:
    # A minor or major release pull request fails until its eval results are on main and
    # release-please has rebuilt the pull request on top of them. Other pull requests pass.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require eval evidence for a minor or major release
        run: .github/scripts/check-release-evidence.sh
