name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported version and the one the evals were run with.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.6"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Lint the skill and eval data
        run: uv run --locked evals/run.py lint
      - name: Check the graders and release gates
        run: uv run --locked evals/run.py selftest
      - name: Type-check the runner
        run: >-
          uvx mypy==2.3.1 --strict --python-version ${{ matrix.python }}
          --python-executable "$(uv python find --script evals/run.py)" evals/run.py
